name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

# Serialised per pull request and per branch, so a pull request cannot race its own earlier
# run. Deploys from different pull requests still overlap, which is safe because they write
# to separate directories and rebase rather than force-push. Nothing is cancelled mid-flight,
# because a cancelled run can leave the branch holding a half-written site.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PROJECT_PATH: src/MausritterTools.Web/MausritterTools.Web.csproj
  # GitHub Pages serves exactly one publishing source per repository, so production and
  # every preview are directories on this single branch rather than separate sites.
  PAGES_BRANCH: gh-pages
  PREVIEW_DIR: pr-preview

jobs:
  build:
    name: Build
    # A closed pull request has nothing left to publish, only a preview to tear down.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-restore --output publish

      - name: Rewrite base href
        run: |
          repo_name='${{ github.event.repository.name }}'
          if [[ "$repo_name" == *.github.io ]]; then
            site_root='/'
          else
            site_root="/$repo_name/"
          fi
          # A preview is served from a subdirectory, so it needs its own base href;
          # inheriting the production one would make it fetch _framework from the root.
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            base_href="${site_root}${PREVIEW_DIR}/pr-${{ github.event.pull_request.number }}/"
          else
            base_href="$site_root"
          fi
          echo "Using base href: $base_href"
          sed -i "s|<base href=\"/\" />|<base href=\"$base_href\" />|g" publish/wwwroot/index.html
          grep -qF "<base href=\"$base_href\" />" publish/wwwroot/index.html \
            || { echo "::error::Failed to rewrite <base href> in index.html"; exit 1; }

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: publish/wwwroot
          # .nojekyll is a dotfile, and upload-artifact drops hidden files unless asked
          # not to. Losing it would let Jekyll strip the _framework directory.
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy production site
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish to ${{ env.PAGES_BRANCH }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ env.PAGES_BRANCH }}
          folder: site
          # Previews live on the same branch, so a production deploy must not mistake them
          # for stale files and delete every open pull request's preview.
          clean-exclude: ${{ env.PREVIEW_DIR }}
          commit-message: 'Deploy ${{ github.sha }}'
          # Rebase onto the deployment branch rather than force-pushing over it, so a
          # preview published at the same moment is not overwritten.
          force: false

  preview:
    name: Deploy pull request preview
    needs: build
    # A pull request from a fork is given a read-only token, so it can be built and checked
    # but cannot publish anything. Skipping keeps that case green instead of failing.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Prepare the Jekyll marker for the branch root
        # A preview is written to a subdirectory, so its own .nojekyll never reaches the
        # branch root. If a preview is what first creates the branch, the root marker would
        # be missing and Jekyll would strip _framework from every preview, at any depth.
        run: |
          mkdir branch-root
          touch branch-root/.nojekyll

      - name: Ensure Jekyll is disabled at the branch root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ env.PAGES_BRANCH }}
          folder: branch-root
          # Add the marker beside whatever is already there; a production site must never
          # be cleaned away by a preview.
          clean: false
          force: false
          commit-message: 'Disable Jekyll on the deployment branch'

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: ${{ env.PAGES_BRANCH }}
          umbrella-dir: ${{ env.PREVIEW_DIR }}
          action: deploy

  preview-cleanup:
    name: Remove pull request preview
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: ${{ env.PAGES_BRANCH }}
          umbrella-dir: ${{ env.PREVIEW_DIR }}
          action: remove
