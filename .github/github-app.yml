# Configuration for the GitHub Copilot app.
# Reference: https://docs.github.com/copilot/reference/github-copilot-app-reference/repository-configuration

instructions: |
  A Blazor WebAssembly standalone app: the whole site is static files that run in the
  visitor's browser. There is no server and nothing is uploaded.

  The code is in three layers, split by whether it knows what Mausritter is. Structed.Inkwell
  is the game-agnostic engine: randomness, dice, data loading and translation
  overlays, name assembly, map generation, SVG rendering, the export envelope. It must never
  learn about settlements. Structed.Inkwell.FantasiaArchive is
  interop with someone else's app, kept separate so a tool can opt out. Both are NuGet
  packages built from github.com/structed/inkwell, not code in this repository: fix the
  engine there and release a version, never by bending it around a Mausritter problem.
  MausritterTools.Core
  is what is actually Mausritter, and holds all domain logic so the generators can be tested
  without a browser; MausritterTools.Web is a thin UI over it. Put logic in Core, not in a
  .razor file, and put anything another game would want in the engine instead.

  Table data lives in src/MausritterTools.Web/wwwroot/data/ and is split by provenance:

  - data/srd/ is GENERATED from the Mausritter SRD. Never hand-edit it. Change
    tools/Import-SrdTables.ps1 and re-run the importer instead.
  - data/house/ is hand-written original content and is safe to edit directly.
  - data/ui.json is every string the app shows that is not a table entry.
  - data/i18n/<locale>/ mirrors all of the above and is hand-written, including the
    translations of the generated files. That is not a contradiction: the generated tree is
    still the only thing the importer writes, and the importer re-checks the overlays.

  The app ships in English and German. English is canonical; a translation is an overlay
  deep-merged onto the canonical JSON before it is deserialised, so generators never know
  about languages. Six things are easy to break by accident:

  - Mausritter has no shops or services table, so that whole layer is an unofficial house
    rule. Keep it labelled as such in the UI, and keep each service's srdBasis honest about
    which SRD rule it was extrapolated from. The German text is likewise an unofficial fan
    translation and must stay labelled as one, because CC BY 4.0 requires a modification to
    be declared.
  - Never use System.Random for anything reachable from a seed. Its seeded output is not
    stable across .NET versions, which would silently invalidate every shared seed URL. Use
    the Pcg32 generator in Inkwell's Randomness namespace.
  - A field path such as settlement/event is a load-bearing string, not a label. It is an
    input to the generator AND the key a lock is filed under in every shared link and export,
    so renaming one changes what a seed rolls and orphans every file already written. Same
    for export format ids, version numbers, JSON property names and the map's stream keys.
    GoldenBaselineTests pins all of it; never regenerate its fixture to make it pass.
  - The System.Text.Json source generator discards property initialisers, so a property
    absent from a data file arrives as null whatever default is written on it. Non-nullable
    properties on the data models coerce null in their getters; keep it that way when adding
    new ones. JsonDefaultsTests guards this.
  - A translated table must have exactly as many rows as its original, in the same order,
    because every value is an index into a table. Keys are never translated: ids, dice
    expressions, gear category ids, stock.itemNames, and a gear item's or hireling's `name`,
    which three files join on and the card rules match against. A gear item displays `label`
    instead. Translating a key does not fail loudly; it empties a shop or blanks a card.
    TranslationTests guards all of this.
  - Anything whose order or numbering the player can see must be keyed off ids, not names:
    a shop's position is its map number and part of its lock's field path, so sorting it by
    a translated name would renumber the map and move every lock on a language switch.

  The CC BY 4.0 attribution and the Mausritter Third Party Licence notice must stay visible
  on the site itself, not only in the repository. Do not use the Mausritter or Losing Games
  logos anywhere.

scripts:
  - name: Setup
    command: dotnet restore MausritterTools.slnx
    triggers:
      - session.create

  # The http profile is explicit so the port is predictable and no HTTPS development
  # certificate has to be trusted first.
  - name: Run
    command: dotnet run --project src/MausritterTools.Web --launch-profile http

  - name: Test
    command: dotnet test MausritterTools.slnx

  # Re-imports the SRD tables into wwwroot/data/srd/, then checks every translation overlay
  # still lines up with them. Run after changing the importer, or to pick up a newer SRD
  # release, then commit the regenerated JSON.
  - name: Import SRD tables
    command: pwsh ./tools/Import-SrdTables.ps1 -Refresh

# ASP.NET logs "Now listening on: http://localhost:5023" once the app is serving.
server_ready_pattern: '(?i)Now listening on:\s+(https?://\S+)'
auto_open_in_browser: true
